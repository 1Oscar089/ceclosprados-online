<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
  <title>Juegos | CENTRO ESCOLAR CANTÓN LOS PRADOS</title>
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    /* ===== JUEGOS PREMIUM - PASTEL DESIGN ===== */
    .back-btn { 
      display: inline-flex; align-items: center; gap: 0.5rem; 
      margin-bottom: 1.5rem; color: var(--text-muted); font-weight: 500; 
      padding: 0.5rem 0.8rem; border-radius: 0.6rem;
      transition: all 0.2s;
    }
    .back-btn:hover { 
      color: var(--primary); background: var(--surface-hover); 
      transform: translateX(-2px); text-decoration: none; 
    }
    
    .grade-badge { 
      margin-left: 0.5rem; vertical-align: middle; 
      background: linear-gradient(135deg, #34d399, #10b981);
      color: white; padding: 0.2rem 0.6rem; border-radius: 999px;
      font-size: 0.75rem; font-weight: 700;
      box-shadow: 0 2px 6px rgba(16, 185, 129, 0.3);
    }
    
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.5rem;
      padding-bottom: 3rem;
    }
    
    .game-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      border: 2px solid rgba(167, 139, 250, 0.2);
      border-radius: 1rem;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
      box-shadow: 0 4px 16px rgba(139, 92, 246, 0.08);
      animation: fadeInUp 0.4s ease forwards;
      position: relative;
    }
    
    .game-card:nth-child(1) { animation-delay: 0.0s; }
    .game-card:nth-child(2) { animation-delay: 0.05s; }
    .game-card:nth-child(3) { animation-delay: 0.1s; }
    
    [data-theme="dark"] .game-card {
      background: rgba(30, 27, 75, 0.85);
      border-color: rgba(99, 102, 241, 0.3);
    }
    
    .game-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(139, 92, 246, 0.2);
      border-color: var(--primary);
    }
    
    .game-header { display: flex; align-items: flex-start; gap: 1rem; }
    
    .game-icon {
      width: 56px; height: 56px;
      background: linear-gradient(135deg, #f3e8ff, #e9d5ff);
      border-radius: 16px;
      display: grid; place-items: center;
      color: #9333ea; flex-shrink: 0;
    }
    [data-theme="dark"] .game-icon {
      background: linear-gradient(135deg, #312e81, #1e1b4b);
      color: #c084fc;
    }
    .game-icon svg { width: 28px; height: 28px; }
    
    .game-title { 
      margin: 0 0 0.4rem 0; 
      font-size: 1.1rem; 
      font-weight: 700; 
      color: var(--text); 
      line-height: 1.3; 
    }
    
    .game-desc {
      font-size: 0.92rem;
      color: var(--text-muted);
      margin: 0;
      line-height: 1.5;
      flex: 1;
    }
    
    .game-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-top: auto;
    }
    
    .energy-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.82rem;
      font-weight: 600;
      color: #b91c1c;
      background: #fee2e2;
      padding: 0.3rem 0.7rem;
      border-radius: 999px;
      border: 1px solid #fecaca;
    }
    [data-theme="dark"] .energy-badge {
      background: #450a0a;
      color: #fca5a5;
      border-color: #7f1d1d;
    }
    .energy-badge svg { width: 16px; height: 16px; fill: currentColor; }
    
    .btn-jugar {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
      padding: 0.7rem 1.4rem;
      background: linear-gradient(135deg, #a78bfa, #8b5cf6);
      color: white; border-radius: 0.75rem;
      font-weight: 600; font-size: 0.95rem;
      text-decoration: none; transition: all 0.2s;
      box-shadow: 0 2px 6px rgba(139, 92, 246, 0.3);
      border: none; cursor: pointer;
    }
    .btn-jugar:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(139, 92, 246, 0.4);
    }
    .btn-jugar:disabled {
      opacity: 0.6; cursor: not-allowed; transform: none !important;
    }
    
    @keyframes fadeInUp { 
      from { opacity: 0; transform: translateY(15px); } 
      to { opacity: 1; transform: translateY(0); } 
    }
    
    @media (max-width: 768px) {
      .games-grid { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1rem; }
      .game-card { padding: 1.25rem; }
    }
    @media (max-width: 480px) {
      .games-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="userbar"></div>

  <header class="app-container mt-6">
    <a href="home.html" class="btn btn-ghost back-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
      Volver al Inicio
    </a>
    <h1 class="text-xl font-bold mb-2" style="display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;">
      <span class="icon icon-md" style="color: var(--primary); display: inline-flex;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24">
          <circle cx="12" cy="12" r="2"/><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
        </svg>
      </span>
      <span>Juegos Educativos</span>
    </h1>
    <p class="text-muted">Aprende jugando, gana puntos y sube de nivel</p>
  </header>

  <main class="app-container">
    <div id="games-grid" class="games-grid"></div>
  </main>

  <script type="module">
    // ✅ CORRECCIÓN: Importar initFirebase para acceder a db y auth
    import { initFirebase } from '../js/initFirebase.js';
    import { initUserBar, updateUserBarStats } from '../js/userbar.js';
    import { doc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";
    
    initUserBar('#userbar');
    const { db, auth } = initFirebase();

    // ===== BASE DE DATOS DE JUEGOS =====
    const JUEGOS_DB = [
      {
        id: 'matematica-rapida',
        titulo: 'Matemática Rápida',
        descripcion: 'Resuelve operaciones mentales contra el reloj. ¡Entrena tu agilidad numérica!',
        url: '../juegos/matematica-rapida.html',
        costo: 1,
        icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 6h8M8 10h8M8 14h4M8 18h4"/></svg>`
      },
      {
        id: 'ahorca-ciencias',
        titulo: 'Ahorca de Ciencias',
        descripcion: 'Descubre términos científicos ocultos. ¡No dejes que se acaben las vidas!',
        url: '../juegos/ahorca-ciencias.html',
        costo: 1,
        icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 3v6l-3 3h12l-3-3V3"/><path d="M10 12v4a2 2 0 0 0 4 0v-4"/><path d="M8 21h8"/><path d="M12 17v4"/></svg>`
      },
      {
        id: 'memory-historico',
        titulo: 'Memory Histórico',
        descripcion: 'Empareja fechas y eventos clave de la historia. ¡Entrena tu memoria!',
        url: '../juegos/memory-historico.html',
        costo: 1,
        icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>`
      }
    ];

    // ===== LÓGICA DE JUEGO CON COSTO DE ENERGÍA =====
    window.handleJugar = async function(url, costo) {
      const cached = JSON.parse(localStorage.getItem('cecp_user_data') || '{}');
      const energiaActual = cached.energia ?? 5;
      
      if (energiaActual < costo) {
        window.showToast('No tienes suficiente energía ❤️. ¡Vuelve mañana cuando se restablezcan!', 'warning');
        return;
      }
      
      // Descontar energía en localStorage inmediatamente
      const nuevaEnergia = energiaActual - costo;
      localStorage.setItem('cecp_user_data', JSON.stringify({ ...cached, energia: nuevaEnergia }));
      
      // Actualizar UI de la userbar instantáneamente
      updateUserBarStats(cached.puntos ?? 0, nuevaEnergia, cached.nivel ?? 1);
      
      // Sincronizar con Firebase (en segundo plano)
      try {
        const user = auth.currentUser;
        if (user) {
          const initials = (user.displayName || 'USR').split(' ').map(n => n[0]).join('').slice(0, 3).toUpperCase();
          const local = user.email?.split('@')[0] || '';
          const docId = `est_${local}_${initials}`;
          await updateDoc(doc(db, 'users', docId), {
            energia: nuevaEnergia,
            updatedAt: serverTimestamp()
          });
        }
      } catch (e) {
        console.warn('Sync energía Firebase:', e);
      }
      
      window.showToast(`-${costo} energía. ¡Buena suerte! 🎮`, 'info', 2000);
      
      // Navegar al juego con un pequeño delay para ver el toast
      setTimeout(() => { window.location.href = url; }, 300);
    };

    // ===== RENDERIZADO =====
    function renderJuegos() {
      const container = document.getElementById('games-grid');
      container.innerHTML = '';
      
      JUEGOS_DB.forEach(juego => {
        const card = document.createElement('div');
        card.className = 'game-card';
        card.innerHTML = `
          <div class="game-header">
            <div class="game-icon">${juego.icon}</div>
            <div>
              <h3 class="game-title">${juego.titulo}</h3>
              <p class="game-desc">${juego.descripcion}</p>
            </div>
          </div>
          <div class="game-meta">
            <span class="energy-badge">
              <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
              Costo: ${juego.costo} energía
            </span>
            <button class="btn-jugar" onclick="window.handleJugar('${juego.url}', ${juego.costo})">
              ▶ Jugar Ahora
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // ===== INICIALIZACIÓN =====
    document.addEventListener('DOMContentLoaded', () => {
      renderJuegos();
    });
  </script>
</body>
</html>
