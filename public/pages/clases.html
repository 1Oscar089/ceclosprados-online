<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Clases | C.E. Cantón Los Prados</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/boxicons/2.1.4/css/boxicons.min.css" rel="stylesheet">
    
    <style>
        /* =========================================================================
           SISTEMA DE VARIABLES DINÁMICAS: "CYBER-BENTO GLASS V3"
           ========================================================================= */
        :root {
            --bg-base: #EEF2F6;
            --bg-mesh-1: #E0E7FF;
            --bg-mesh-2: #FAE8FF;
            --card-bg: rgba(255, 255, 255, 0.65);
            --card-border: rgba(255, 255, 255, 0.6);
            --card-inner: #FFFFFF;
            
            --primary: #4F46E5;
            --primary-gradient: linear-gradient(135deg, #6366F1 0%, #4F46E5 100%);
            --primary-glow: rgba(79, 70, 229, 0.15);
            --secondary: #0EA5E9;
            --accent: #F43F5E;
            --text-main: #0F172A;
            --text-muted: #475569;
            --glass-blur: blur(25px);
            --shadow-premium: 0 25px 50px -12px rgba(15, 23, 42, 0.08);
        }

        [data-theme="dark"] {
            --bg-base: #060814;
            --bg-mesh-1: #0B1536;
            --bg-mesh-2: #1E0B30;
            --card-bg: rgba(15, 23, 42, 0.55);
            --card-border: rgba(255, 255, 255, 0.05);
            --card-inner: #0B1120;
            
            --primary: #6366F1;
            --primary-gradient: linear-gradient(135deg, #818CF8 0%, #6366F1 100%);
            --primary-glow: rgba(99, 102, 241, 0.3);
            --secondary: #38BDF8;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --shadow-premium: 0 30px 60px -15px rgba(0, 0, 0, 0.6);
        }

        /* Reset Absoluto */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
            transition: background 0.3s cubic-bezier(0.4, 0, 0.2, 1), 
                        border-color 0.3s ease, 
                        color 0.3s ease, 
                        box-shadow 0.3s ease,
                        transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        *::-webkit-scrollbar { display: none; }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            overflow-y: auto;
            position: relative;
            padding: 0;
            opacity: 0;
        }
        body.loaded { opacity: 1; }

        /* Nubes Orgánicas Animadas de Fondo */
        body::before, body::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(140px);
            pointer-events: none;
            z-index: 1;
            animation: floatMesh 12s infinite alternate ease-in-out;
        }
        body::before { width: 450px; height: 450px; background: var(--bg-mesh-1); top: -10%; left: -10%; }
        body::after { width: 400px; height: 400px; background: var(--bg-mesh-2); bottom: -10%; right: -10%; animation-delay: -6s; }

        @keyframes floatMesh {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, 30px) scale(1.12); }
        }

        /* Contenedor de Anclaje de la Userbar Pura */
        #userbar-root {
            width: 100%;
            z-index: 50;
        }

        /* =========================================================================
           ESTRUCTURA CORE CORREGIDA: ANCHO COMPLETO PANORÁMICO
           ========================================================================= */
        .layout-core {
            width: 100%;
            max-width: none; /* CORREGIDO: Eliminado el límite forzado de ancho para igualar a la userbar */
            
            /* REQUISITO: 1cm (1rem) de margen superior abajo de la userbar */
            margin: 1rem 0 2rem 0; 
            
            /* REQUISITO: Margen lateral de 2cm (2rem) por cada lado */
            padding: 0 2rem; 
            
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            z-index: 10;
        }

        /* Cabecera del Módulo */
        .classroom-header-panel {
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 2rem 2.5rem;
            box-shadow: var(--shadow-premium);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1.5rem;
        }

        .header-left-block {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .btn-back-nav {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: var(--card-inner);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.4rem;
            text-decoration: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.01);
        }
        .btn-back-nav:hover {
            border-color: var(--primary);
            color: var(--primary);
            transform: translateX(-3px);
        }

        .title-meta h1 {
            font-size: clamp(1.6rem, 4vw, 2.2rem);
            font-weight: 900;
            letter-spacing: -0.04em;
            line-height: 1.1;
            color: var(--text-main);
        }
        .title-meta p {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-top: 0.2rem;
        }

        .classroom-badge {
            background: var(--primary-gradient);
            color: #FFFFFF;
            padding: 0.55rem 1.1rem;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 800;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            box-shadow: 0 4px 12px var(--primary-glow);
        }

        /* =========================================================================
           ACORDEÓN BENTO DE UNIDADES, TEMAS Y CLASES
           ========================================================================= */
        .syllabus-container {
            display: flex;
            flex-direction: column;
            gap: 2rem;
            width: 100%;
        }

        .unit-block {
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 2.5rem;
            box-shadow: var(--shadow-premium);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .unit-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            border-bottom: 2px solid var(--card-border);
            padding-bottom: 1.25rem;
        }
        .unit-icon {
            width: 50px;
            height: 50px;
            border-radius: 14px;
            background: var(--primary-gradient);
            color: #FFFFFF;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.4rem;
            box-shadow: 0 4px 12px var(--primary-glow);
        }
        .unit-header h2 {
            font-size: 1.6rem;
            font-weight: 900;
            letter-spacing: -0.03em;
            color: var(--text-main);
        }

        .topic-block {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-top: 0.5rem;
        }
        .topic-title {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }
        .topic-title i { font-size: 1.3rem; color: var(--primary); }

        /* Filas de Clase Listadas (Sub-elementos de ancho completo) */
        .class-row-link {
            width: 100%;
            background: var(--card-inner);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 1.25rem 1.75rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-decoration: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.01);
        }
        .class-row-link:hover {
            transform: translateX(6px);
            border-color: var(--primary);
            box-shadow: 0 10px 25px var(--primary-glow);
        }

        .class-meta {
            display: flex;
            align-items: center;
            gap: 1.25rem;
        }
        .class-icon-orb {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            background: var(--bg-base);
            border: 1px solid var(--card-border);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            color: var(--text-main);
        }
        .class-row-link:hover .class-icon-orb {
            background: var(--primary);
            color: #FFFFFF;
            border-color: transparent;
        }
        .class-meta h3 {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.01em;
        }
        
        .class-action-arrow {
            color: var(--text-muted);
            font-size: 1.4rem;
        }
        .class-row-link:hover .class-action-arrow {
            color: var(--primary);
            transform: translateX(4px);
        }

        footer {
            width: 100%;
            text-align: center;
            padding: 2rem 1rem 1rem 1rem;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-muted);
            opacity: 0.4;
            z-index: 10;
        }

        @media (max-width: 768px) {
            .layout-core { padding: 0 1rem; margin-top: 0.5rem; }
            .classroom-header-panel { padding: 1.5rem; border-radius: 20px; }
            .header-left-block { gap: 1rem; }
            .btn-back-nav { width: 38px; height: 38px; font-size: 1.2rem; border-radius: 10px; }
            .classroom-badge { display: none; }
            
            .unit-block { padding: 1.5rem; border-radius: 20px; }
            .unit-header h2 { font-size: 1.3rem; }
            .unit-icon { width: 42px; height: 42px; font-size: 1.2rem; }
            
            .class-row-link { padding: 1rem 1.25rem; border-radius: 14px; }
            .class-icon-orb { width: 36px; height: 36px; font-size: 1.1rem; }
            .class-meta h3 { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <div id="userbar-root"></div>

    <div class="layout-core">
        <section class="classroom-header-panel">
            <div class="header-left-block">
                <a href="#" id="btn-return" class="btn-back-nav" aria-label="Volver al panel principal">
                    <i class='bx bx-left-arrow-alt'></i>
                </a>
                <div class="title-meta">
                    <h1>Material de Clases</h1>
                    <p id="grade-subtitle">Cargando currícula...</p>
                </div>
            </div>
            <div class="classroom-badge" id="classroom-badge-text">...</div>
        </section>

        <div id="syllabus-container" class="syllabus-container"></div>
    </div>

    <footer>&copy; 2026 Centro Escolar Cantón Los Prados.</footer>

    <script type="module">
        import { auth } from '../js/initFirebase.js';
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { initUserBar } from '../js/userbar.js';

        const urlParams = new URLSearchParams(window.location.search);
        const gradeId = urlParams.get('grado') || '7';

        document.getElementById('btn-return').href = `./grados.html?grado=${gradeId}`;
        
        const gradeNames = { '7': 'Séptimo Grado', '8': 'Octavo Grado', '9': 'Noveno Grado' };

        const curriculumData = {
            '7': [
                {
                    unit: "Unidad 1: Números Positivos, Negativos y el Cero",
                    topics: [
                        {
                            topicName: "1. Números con signo",
                            classes: [
                                { name: "1.1 Números que indican temperatura", file: "clase_1_1.html" },
                                { name: "1.2 Ubicación en la recta numérica", file: "clase_1_2.html" }
                            ]
                        }
                    ]
                }
            ],
            '8': [
                {
                    unit: "Unidad 1: Operaciones con Polinomios",
                    topics: [
                        {
                            topicName: "1. Suma y Resta",
                            classes: [
                                { name: "1.1 Reducción de términos semejantes", file: "clase_1_1.html" }
                            ]
                        }
                    ]
                }
            ],
            '9': [
                {
                    unit: "Unidad 1: Ecuaciones Cuadráticas",
                    topics: [
                        {
                            topicName: "1. Introducción a las Ecuaciones",
                            classes: [
                                { name: "1.1 Concepto de ecuación cuadrática", file: "clase_1_1.html" }
                            ]
                        }
                    ]
                }
            ]
        };

        const renderSyllabus = () => {
            const container = document.getElementById('syllabus-container');
            container.innerHTML = '';
            const gradeCurriculum = curriculumData[gradeId] || [];
            
            if (gradeCurriculum.length === 0) {
                container.innerHTML = `<div class="unit-block"><h2 style="text-align:center;">Pronto se publicará el material.</h2></div>`;
                return;
            }

            const fragment = document.createDocumentFragment();
            gradeCurriculum.forEach(unit => {
                const unitBlock = document.createElement('div');
                unitBlock.className = 'unit-block';
                unitBlock.innerHTML = `
                    <div class="unit-header">
                        <div class="unit-icon"><i class='bx bx-book-content'></i></div>
                        <h2>${unit.unit}</h2>
                    </div>
                `;

                unit.topics.forEach(topic => {
                    const topicBlock = document.createElement('div');
                    topicBlock.className = 'topic-block';
                    topicBlock.innerHTML = `<div class="topic-title"><i class='bx bx-folder-open'></i> ${topic.topicName}</div>`;

                    topic.classes.forEach(cls => {
                        const classLink = document.createElement('a');
                        classLink.href = `../grado${gradeId}/clases/${cls.file}`;
                        classLink.className = 'class-row-link';
                        classLink.innerHTML = `
                            <div class="class-meta">
                                <div class="class-icon-orb"><i class='bx bx-play'></i></div>
                                <h3>${cls.name}</h3>
                            </div>
                            <i class='bx bx-chevron-right class-action-arrow'></i>
                        `;
                        topicBlock.appendChild(classLink);
                    });
                    unitBlock.appendChild(topicBlock);
                });
                fragment.appendChild(unitBlock);
            });
            container.appendChild(fragment);
        };

        initUserBar('userbar-root');
        setTimeout(() => { document.body.classList.add('loaded'); }, 50);

        onAuthStateChanged(auth, (user) => {
            if (!user) { window.location.href = '../index.html'; return; }
            const gradeName = gradeNames[gradeId] || 'Aula Virtual';
            document.getElementById('grade-subtitle').textContent = `Temario Oficial de ${gradeName}`;
            document.getElementById('classroom-badge-text').textContent = `Grado ${gradeId}°`;
            renderSyllabus();
        });
    </script>
</body>
</html>
