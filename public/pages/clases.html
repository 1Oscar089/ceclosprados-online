<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
  <title>Clases | CENTRO ESCOLAR CANTÓN LOS PRADOS</title>
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    /* ===== CLASES PREMIUM - PASTEL DESIGN ===== */
    .back-btn { 
      display: inline-flex; align-items: center; gap: 0.5rem; 
      margin-bottom: 1.5rem; color: var(--text-muted); font-weight: 500; 
      padding: 0.5rem 0.8rem; border-radius: 0.6rem;
      transition: all 0.2s;
    }
    .back-btn:hover { 
      color: var(--primary); background: var(--surface-hover); 
      transform: translateX(-2px); text-decoration: none; 
    }
    
    .grade-badge { 
      margin-left: 0.5rem; vertical-align: middle; 
      background: linear-gradient(135deg, #34d399, #10b981);
      color: white; padding: 0.2rem 0.6rem; border-radius: 999px;
      font-size: 0.75rem; font-weight: 700;
      box-shadow: 0 2px 6px rgba(16, 185, 129, 0.3);
    }
    
    .icon { display: inline-flex; align-items: center; justify-content: center; }
    .icon-sm { width: 20px; height: 20px; }
    .icon-md { width: 24px; height: 24px; }
    
    .accordion { width: 100%; position: relative; min-height: 200px; }
    
    .accordion-item { 
      margin-bottom: 1rem; 
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(12px);
      border: 2px solid rgba(167, 139, 250, 0.2);
      border-radius: 1rem; 
      overflow: hidden; 
      box-shadow: 0 4px 16px rgba(139, 92, 246, 0.1);
      transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
      animation: slideIn 0.3s ease forwards;
      opacity: 0; transform: translateY(10px);
    }
    
    [data-theme="dark"] .accordion-item {
      background: rgba(30, 27, 75, 0.8);
      border: 2px solid rgba(99, 102, 241, 0.3);
      box-shadow: 0 4px 16px rgba(99, 102, 241, 0.2);
    }
    
    .accordion-item:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(139, 92, 246, 0.2);
      border-color: rgba(167, 139, 250, 0.4);
    }
    
    .accordion-header { 
      display: flex; align-items: center; justify-content: space-between; 
      padding: 1rem 1.25rem; cursor: pointer; 
      background: transparent; transition: background 0.2s; 
    }
    .accordion-header:hover { background: rgba(167, 139, 250, 0.05); }
    
    .accordion-header h3 { 
      margin: 0; font-size: 1.1rem; font-weight: 700; 
      display: flex; align-items: center; gap: 0.6rem; color: var(--text);
    }
    
    .acc-chevron { 
      width: 20px; height: 20px; transition: transform 0.3s ease; 
      color: var(--text-muted); 
    }
    .accordion-header.active .acc-chevron { 
      transform: rotate(180deg); color: var(--primary); 
    }
    
    .accordion-body { 
      max-height: 0; overflow: hidden; 
      transition: max-height 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); 
      background: rgba(240, 249, 255, 0.5);
    }
    
    [data-theme="dark"] .accordion-body { background: rgba(49, 46, 129, 0.3); }
    
    .nested { padding: 0.5rem 1.25rem 1.25rem; }
    
    .unit-title { 
      font-weight: 700; margin: 1.2rem 0 0.6rem; 
      color: #4f46e5; font-size: 1rem; 
      padding-left: 0.5rem; border-left: 3px solid #a78bfa;
    }
    [data-theme="dark"] .unit-title { color: #a78bfa; }
    
    .topic-title { 
      font-size: 0.92rem; margin: 0.8rem 0 0.4rem; 
      padding-left: 0.8rem; border-left: 2px solid var(--border); 
      color: var(--text-muted); font-weight: 600;
    }
    
    .class-link { 
      display: flex; flex-direction: column; gap: 0.4rem; 
      padding: 0.8rem 1rem; text-decoration: none; 
      color: var(--text); border-radius: 0.6rem; 
      transition: all 0.2s ease; font-size: 0.95rem;
      background: white; margin: 0.5rem 0;
      border: 1px solid var(--border);
    }
    [data-theme="dark"] .class-link { background: #312e81; border-color: #4f46e5; }
    
    .class-link:hover:not(.locked) { 
      background: var(--primary-light); color: var(--primary); 
      transform: translateX(4px); border-color: var(--primary);
      box-shadow: 0 2px 8px rgba(139, 92, 246, 0.15);
    }
    [data-theme="dark"] .class-link:hover:not(.locked) { background: rgba(99, 102, 241, 0.2); }

    /* Contenedor del encabezado de la tarjeta (título + badge) */
    .class-link-header { display: flex; align-items: center; width: 100%; gap: 0.6rem; }
    
    /* Contenedor de las fechas */
    .class-link-dates { font-size: 0.8rem; color: var(--text-muted); margin-left: 2rem; line-height: 1.5; }
    
    /* ===== STATUS BADGES & LOCKS ===== */
    .status-badge {
      font-size: 0.7rem; font-weight: 800; padding: 0.2rem 0.6rem; 
      border-radius: 999px; white-space: nowrap; margin-left: auto; text-transform: uppercase;
    }
    .status-pending { background: #fef08a; color: #854d0e; }
    .status-active { background: #dcfce7; color: #166534; }
    .status-finished { background: #f3f4f6; color: #475569; }
    
    [data-theme="dark"] .status-pending { background: #713f12; color: #fde047; }
    [data-theme="dark"] .status-active { background: #064e3b; color: #86efac; }
    [data-theme="dark"] .status-finished { background: #1e293b; color: #94a3b8; }

    .class-link.locked {
      opacity: 0.6; cursor: not-allowed; pointer-events: none; filter: grayscale(1);
    }
    
    .doc-icon { width: 18px; height: 18px; opacity: 0.8; flex-shrink: 0; color: var(--primary); transition: color 0.2s; }
    .class-link:hover:not(.locked) .doc-icon { color: var(--primary-hover); }
    
    /* Spinner */
    .loader-spinner { border: 4px solid rgba(167, 139, 250, 0.2); border-top: 4px solid var(--primary); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; position: absolute; top: 50px; left: 50%; transform: translateX(-50%); }
    
    @keyframes spin { 0% { transform: translateX(-50%) rotate(0deg); } 100% { transform: translateX(-50%) rotate(360deg); } }
    @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    
    @media (max-width: 768px) {
      .accordion-header { padding: 0.85rem 1rem; }
      .nested { padding: 0.4rem 1rem 1rem; }
      .class-link { padding: 0.7rem 0.8rem; font-size: 0.9rem; }
    }
  </style>
</head>

    // ===== MANEJO DE FECHAS =====
    function getFormattedDate(daysOffset = 0, time = "00:00") {
      const d = new Date();
      d.setDate(d.getDate() + daysOffset);
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}T${time}`;
    }

    function formatDateTime(dateStr) {
      if(!dateStr) return 'Sin configurar';
      const d = new Date(dateStr);
      return d.toLocaleString('es-SV', { 
        timeZone: 'America/El_Salvador',
        day: '2-digit', month: '2-digit', year: 'numeric',
        hour: '2-digit', minute: '2-digit',
        hour12: true 
      });
    }

    function evaluateStatus(data) {
      const now = new Date();
      const start = new Date(data.inicio);
      const end = new Date(data.fin);

      if (now < start) return 'pendiente';
      if (now > end) return 'finalizado';
      return 'curso';
    }

    // ===== LÓGICA DE FIREBASE PARA CREAR/LEER CLASES =====
    async function ensureClassDoc(materiaNombre, clase, grado) {
       const matID = MATERIA_MAP[materiaNombre] || "matematica";
       const docRef = doc(db, 'clases', matID, 'entregas', clase.id);
       
       try {
         const snap = await getDoc(docRef);
         if (!snap.exists()) {
            const data = {
               id: clase.id,
               titulo: clase.titulo,
               grado: grado,
               materia: matID,
               año: new Date().getFullYear(), // Guardamos el año actual
               inicio: getFormattedDate(0, "00:00"), 
               fin: getFormattedDate(7, "23:59"),    
               respuestas: {},
               createdAt: serverTimestamp()
            };
            await setDoc(docRef, data);
            return data;
         }
         return snap.data();
       } catch (error) {
         console.error(`Error asegurando documento para ${clase.id}:`, error);
         return { 
           inicio: getFormattedDate(0, "00:00"), 
           fin: getFormattedDate(7, "23:59"),
           año: new Date().getFullYear()
         }; 
       }
    }

    // ===== DETECCIÓN DE GRADO =====
    async function getGradoFromFirebase(user) {
      try {
        const initials = (user.displayName || 'USR').split(' ').map(n => n[0]).join('').slice(0, 3).toUpperCase();
        const local = user.email?.split('@')[0] || '';
        const docId = `est_${local}_${initials}`;
        const snap = await getDoc(doc(db, 'users', docId));
        if (snap.exists()) return snap.data().grado || 7;
        return 7;
      } catch (err) {
        return 7;
      }
    }

    async function detectGrado() {
      const params = new URLSearchParams(window.location.search);
      if (params.has('grado')) return parseInt(params.get('grado')) || 7;
      
      const demo = sessionStorage.getItem('demoUser');
      if (demo) return JSON.parse(demo).grado || 7;
      
      return new Promise((resolve) => {
        const unsubscribe = onAuthStateChanged(auth, async (user) => {
          unsubscribe();
          if (user) {
            const grado = await getGradoFromFirebase(user);
            resolve(grado);
          } else {
            resolve(7);
          }
        });
        setTimeout(() => { unsubscribe(); resolve(7); }, 3000);
      });
    }

    // ===== RENDERIZADO OPTIMIZADO =====
    async function loadAndRenderClases(dataDb, grado) {
      const container = document.getElementById('accordion-container');
      const currentYear = new Date().getFullYear();
      
      const classPromises = [];
      const classRefs = [];
      
      for (const [materia, unidades] of Object.entries(dataDb)) {
        for (const [unidad, temas] of Object.entries(unidades)) {
          for (const [tema, clases] of Object.entries(temas)) {
            for (const clase of clases) {
              classRefs.push({ materia, clase });
              classPromises.push(ensureClassDoc(materia, clase, grado));
            }
          }
        }
      }

      const results = await Promise.all(classPromises);
      const classDataMap = {};
      results.forEach((res, index) => {
         classDataMap[classRefs[index].clase.id] = res;
      });

      let html = '';
      
      for (const [materia, unidades] of Object.entries(dataDb)) {
        html += `<div class="accordion-item"><div class="accordion-header"><h3>${materia}</h3>${ICONS.chevron}</div><div class="accordion-body"><div class="nested">`;
        
        for (const [unidad, temas] of Object.entries(unidades)) {
          if (unidad) html += `<div class="unit-title">${unidad}</div>`;
          
          for (const [tema, clases] of Object.entries(temas)) {
            if (tema) html += `<div class="topic-title">${tema}</div>`;
            
            for (const clase of clases) {
              const firebaseData = classDataMap[clase.id];
              const status = evaluateStatus(firebaseData);
              const classYear = firebaseData.año || new Date(firebaseData.inicio).getFullYear();
              
              let badge = '';
              let extraClass = '';
              let href = `../grado${grado}/clases/${clase.id}.html`;
              
              if (classYear !== currentYear) {
                badge = `<span class="status-badge status-finished" style="background:var(--border); color:var(--text-muted);">Año Anterior</span>`;
                extraClass = 'locked';
                href = '#';
              } else if (status === 'pendiente') {
                badge = `<span class="status-badge status-pending">Pendiente</span>`;
                extraClass = 'locked';
                href = '#'; 
              } else if (status === 'curso') {
                badge = `<span class="status-badge status-active">En curso</span>`;
              } else if (status === 'finalizado') {
                badge = `<span class="status-badge status-finished">Finalizado</span>`;
              }

              const dateInfo = `<div class="class-link-dates">
                                  <strong>Abre:</strong> ${formatDateTime(firebaseData.inicio)}<br>
                                  <strong>Cierra:</strong> ${formatDateTime(firebaseData.fin)}
                                </div>`;

              html += `<a href="${href}" class="class-link ${extraClass}">
                         <div class="class-link-header">
                           ${ICONS.doc} 
                           <span style="flex:1;">${clase.titulo}</span>
                           ${badge}
                         </div>
                         ${dateInfo}
                       </a>`;
            }
          }
        }
        html += `</div></div></div>`;
      }
      
      container.innerHTML = html;

      document.querySelectorAll('.accordion-header').forEach(header => {
        header.addEventListener('click', () => {
          const body = header.nextElementSibling;
          const isOpen = body.style.maxHeight && body.style.maxHeight !== '0px';
          
          document.querySelectorAll('.accordion-body').forEach(b => b.style.maxHeight = null);
          document.querySelectorAll('.accordion-header').forEach(h => h.classList.remove('active'));
          
          if (!isOpen) {
            body.style.maxHeight = body.scrollHeight + 'px';
            header.classList.add('active');
          }
        });
      });
    }

    (async function init() {
      const grado = await detectGrado();
      document.getElementById('grade-label').textContent = `${grado}° Grado`;
      
      const data = CLASES_DB[grado] || CLASES_DB[7];
      await loadAndRenderClases(data, grado);
    })();
  </script>
</body>
