<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
  <title>Inicio | CENTRO ESCOLAR CANTÓN LOS PRADOS</title>
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    .page-header { padding-top: 1rem; padding-bottom: 0; }
    .modules-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1.25rem;
      padding: 1.5rem 0 3rem;
    }
    .module-card {
      display: flex; flex-direction: column; align-items: center; text-align: center;
      padding: 1.75rem 1.25rem; text-decoration: none; color: var(--text);
      transition: transform 0.2s, box-shadow 0.2s; position: relative; overflow: hidden;
      border-top: 4px solid var(--card-accent, var(--primary));
    }
    .module-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
    .module-icon { font-size: 2.5rem; margin-bottom: 0.75rem; line-height: 1; }
    .module-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 0.4rem; }
    .module-desc { font-size: 0.9rem; color: var(--text-muted); margin: 0; line-height: 1.4; }
    
    @media (max-width: 768px) { .modules-grid { gap: 1rem; } }
    @media (max-width: 375px) {
      .modules-grid { grid-template-columns: 1fr; }
      .module-card { padding: 1.4rem 1rem; }
      .module-icon { font-size: 2.2rem; }
    }
  </style>
</head>
<body>
  <header class="page-header app-container flex justify-between items-center">
    <h2 class="text-lg font-bold">📖 Mi Espacio de Aprendizaje</h2>
    <button id="theme-toggle" class="btn btn-outline btn-icon" aria-label="Cambiar tema">🌓</button>
  </header>

  <div id="userbar"></div>

  <main class="app-container">
    <section id="modules-grid" class="modules-grid" aria-label="Módulos principales"></section>
  </main>

  <script type="module">
    // ===== TEMA PERSISTENTE =====
    const html = document.documentElement;
    const themeToggle = document.getElementById('theme-toggle');
    const savedTheme = localStorage.getItem('theme') || 'light';
    html.setAttribute('data-theme', savedTheme);
    
    themeToggle.addEventListener('click', () => {
      const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
    });

    // ===== USERBAR =====
    import { initUserBar } from '../js/userbar.js';
    initUserBar('#userbar');

    // ===== CONFIGURACIÓN DE TARJETAS (MODIFICAR AQUÍ) =====
    // Orden alfabético aplicado. Para agregar/quitar: solo edita este array.
    const MODULES = [
      { id: 'clases',   title: 'Clases',   icon: '📚', desc: 'Material, lecciones y recursos', route: 'clases/', accent: 'var(--primary)' },
      { id: 'examenes', title: 'Exámenes', icon: '📝', desc: 'Evaluaciones y pruebas en línea', route: 'examenes/', accent: 'var(--danger)' },
      { id: 'juegos',   title: 'Juegos',   icon: '🎮', desc: 'Aprende jugando y gana puntos', route: 'juegos/', accent: 'var(--secondary)' },
      { id: 'perfil',   title: 'Perfil',   icon: '👤', desc: 'Tu información, logros y stats', route: 'perfil/', accent: 'var(--accent)' },
      { id: 'tareas',   title: 'Tareas',   icon: '📁', desc: 'Entregas, revisiones y feedback', route: 'tareas/', accent: 'var(--success)' },
      { id: 'tienda',   title: 'Tienda',   icon: '🛒', desc: 'Canjea puntos por recompensas', route: 'tienda/', accent: '#8b5cf6' }
    ];

    // ===== RENDERIZADO =====
    const grid = document.getElementById('modules-grid');
    MODULES.forEach(mod => {
      const card = document.createElement('a');
      card.href = `../${mod.route}`;
      card.className = 'module-card card';
      card.style.setProperty('--card-accent', mod.accent);
      card.innerHTML = `
        <div class="module-icon">${mod.icon}</div>
        <h3 class="module-title">${mod.title}</h3>
        <p class="module-desc">${mod.desc}</p>
      `;
      // Prevenir navegación si el módulo aún no está listo
      card.addEventListener('click', (e) => {
        if (mod.route === '#') { e.preventDefault(); alert('Módulo en desarrollo 🚧'); }
      });
      grid.appendChild(card);
    });

    // Exponer config global para futuros scripts
    window.MODULES = MODULES;
  </script>
</body>
</html>
